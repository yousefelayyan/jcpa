<html lang="ar" dir="rtl">

<title>JCPA — التشريعات</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-512.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="JCPA">

<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Noto+Naskh+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1c2733; --ink2:#4b5a68; --ink3:#7b8895;
  --paper:#f5f7f6; --card:#ffffff; --line:#dfe5e3; --line2:#eef2f1;
  --pri:#0f4f4a; --pri2:#14695f; --priTint:#e6f1ef;
  --brass:#a87a2a; --brassTint:#f6efe1;
  --ok:#2d7a4c; --okTint:#e5f3ea; --bad:#b0412e; --badTint:#f8e7e3;
  --r:14px; --sans:"IBM Plex Sans Arabic",Tahoma,sans-serif; --naskh:"Noto Naskh Arabic","Traditional Arabic",serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.7}
button,input,select{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--brass);outline-offset:2px}
a{color:inherit}
.app{min-height:100vh;display:flex;flex-direction:column}
/* top bar */
.top{position:sticky;top:0;z-index:20;background:var(--pri);color:#fff;padding:calc(env(safe-area-inset-top) + 10px) 18px 10px;display:flex;align-items:center;gap:12px}
.top .back{background:rgba(255,255,255,.12);border:0;color:#fff;border-radius:10px;padding:7px 12px;font-weight:600;font-size:14px}
.top .crumb{flex:1;min-width:0}
.top .crumb small{display:block;opacity:.75;font-size:12px;line-height:1.3}
.top .crumb b{display:block;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.4}
.top .brand{font-weight:700;letter-spacing:.5px;font-size:18px}
.iconbtn{background:rgba(255,255,255,.12);border:0;color:#fff;border-radius:10px;width:40px;height:38px;font-size:18px}
main{flex:1;width:100%;max-width:1180px;margin:0 auto;padding:22px 18px 60px}
h1,h2,h3{line-height:1.35;margin:0}
.muted{color:var(--ink3)}
/* home */
.hello{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin:6px 0 22px}
.hello h1{font-size:30px;font-weight:700}
.hello p{margin:4px 0 0;color:var(--ink2)}
.ready{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 16px}
.ring{--p:0;width:58px;height:58px;border-radius:50%;background:conic-gradient(var(--pri) calc(var(--p)*1%),var(--line2) 0);display:grid;place-items:center}
.ring span{width:44px;height:44px;border-radius:50%;background:var(--card);display:grid;place-items:center;font-weight:700;font-size:14px}
.resume{display:flex;align-items:center;gap:16px;background:var(--pri);color:#fff;border-radius:var(--r);padding:18px 20px;margin-bottom:22px;border:0;width:100%;text-align:right}
.resume .seal{background:#fff;color:var(--pri)}
.resume b{display:block;font-size:18px}
.resume small{opacity:.8}
.papers{display:grid;grid-template-columns:1.5fr 1fr;gap:16px;margin-bottom:28px}
.paper{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:22px;text-align:right;display:flex;flex-direction:column;gap:6px}
.paper h2{font-size:22px}
.paper .stat{display:flex;gap:18px;margin-top:10px;color:var(--ink2);font-size:14px}
.paper .stat b{display:block;font-size:22px;color:var(--ink)}
.paper.soon{background:transparent;border-style:dashed;color:var(--ink3)}
.paper.soon h2{color:var(--ink2)}
.tools{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.tool{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;text-align:right}
.tool b{display:block}
.tool small{color:var(--ink3)}
.sectionTitle{font-size:15px;color:var(--ink2);font-weight:600;margin:0 0 10px}
/* marks bar */
.marks{display:flex;height:30px;border-radius:8px;overflow:hidden;margin:6px 0 8px;border:1px solid var(--line)}
.marks div{display:grid;place-items:center;font-size:12px;font-weight:700;color:#fff;border-left:1px solid rgba(255,255,255,.5);min-width:0;overflow:hidden;white-space:nowrap}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--ink2);margin-bottom:22px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-left:5px;vertical-align:middle}
/* rows */
.rows{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.row{display:flex;align-items:center;gap:16px;padding:16px 18px;border:0;border-bottom:1px solid var(--line2);background:none;width:100%;text-align:right}
.row:last-child{border-bottom:0}
.row:hover{background:#fafcfb}
.row .main{flex:1;min-width:0}
.row b{display:block;font-size:17px}
.row small{color:var(--ink3);font-size:13px}
.bar{height:6px;background:var(--line2);border-radius:6px;overflow:hidden;margin-top:8px;max-width:420px}
.bar i{display:block;height:100%;background:var(--pri2);border-radius:6px}
.chev{color:var(--ink3);font-size:20px}
.seal{flex:none;width:52px;height:52px;border-radius:50%;display:grid;place-items:center;background:var(--brassTint);color:var(--brass);font-weight:700;font-size:18px;border:2px solid #e7d6b4;line-height:1}
.seal small{display:block;font-size:10px;font-weight:600;color:var(--brass);margin-top:2px}
.seal.ic{font-size:24px;background:var(--priTint);border-color:#cfe3df}
.pct{font-weight:700;color:var(--pri2);font-size:14px;min-width:44px;text-align:left}
/* law page */
.lawHead{display:flex;align-items:center;gap:16px;margin-bottom:16px;flex-wrap:wrap}
.lawHead h1{font-size:24px}
.lawHead p{margin:2px 0 0;color:var(--ink2);font-size:14px}
.tabs{display:flex;gap:6px;background:var(--line2);padding:4px;border-radius:12px;margin-bottom:18px;width:max-content;max-width:100%}
.tabs button{border:0;background:none;padding:8px 16px;border-radius:9px;font-weight:600;color:var(--ink2)}
.tabs button.on{background:var(--card);color:var(--pri);box-shadow:0 1px 2px rgba(20,40,40,.12)}
.study{display:grid;grid-template-columns:300px 1fr;gap:22px;align-items:start}
.index{position:sticky;top:76px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);max-height:calc(100vh - 100px);display:flex;flex-direction:column;overflow:hidden}
.index input{margin:12px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--paper)}
.index .list{overflow:auto;padding:0 6px 10px}
.index .ch{font-size:12px;color:var(--brass);font-weight:700;padding:12px 10px 4px;line-height:1.5}
.index .it{display:flex;gap:10px;align-items:baseline;width:100%;border:0;background:none;text-align:right;padding:7px 10px;border-radius:9px;font-size:14px;color:var(--ink2);line-height:1.5}
.index .it span{flex:none;min-width:34px;font-weight:700;color:var(--ink);font-size:13px}
.index .it.on{background:var(--priTint);color:var(--pri)}
.index .it.done span{color:var(--ok)}
.index .it.done span::after{content:" ✓";font-size:11px}
.article{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:26px 30px}
.artTop{display:flex;align-items:center;gap:16px;margin-bottom:6px}
.artTop .chap{font-size:13px;color:var(--brass);font-weight:600}
.artTop h2{font-size:22px}
.legal{font-family:var(--naskh);font-size:19px;line-height:2.05;margin:18px 0 6px;color:#16212b}
.legal p{margin:0 0 6px}
.legal .lv1,.legal .lv2{display:grid;grid-template-columns:auto 1fr;gap:10px}
.legal .lv2{margin-right:34px}
.legal .lb{font-family:var(--sans);font-weight:700;color:var(--pri2);font-size:15px;padding-top:4px;min-width:22px}
.legal .def{display:grid;grid-template-columns:minmax(110px,auto) 1fr;gap:14px;border-top:1px dashed var(--line);padding:6px 0}
.legal .def b{font-family:var(--sans);font-size:15px;color:var(--pri);padding-top:4px}
.legal table{border-collapse:collapse;width:100%;font-size:15px;line-height:1.6;margin:6px 0}
.legal td{border:1px solid var(--line);padding:6px 8px;vertical-align:top}
.notes{margin:10px 0 0;padding:10px 14px;border-right:3px solid var(--line);color:var(--ink3);font-size:13px}
.article .voice{position:sticky;top:calc(env(safe-area-inset-top) + 62px);z-index:5;background:var(--card);padding:8px 0;margin-top:6px;border-bottom:1px solid var(--line2)}
.legal .reading{background:#fff4d6;border-radius:8px;box-shadow:0 0 0 6px #fff4d6}
.memo{margin:18px 0 0;background:var(--brassTint);border-radius:12px;padding:14px 16px}
.memo h3{font-size:14px;color:var(--brass);margin-bottom:4px}
.memo p{margin:2px 0;font-size:15px}
.voice{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:14px}
.btn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 14px;font-weight:600;font-size:14px}
.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff}
.btn.big{padding:12px 20px;font-size:16px}
select.btn{padding:8px 10px}
.qs{margin-top:22px}
.qs h3{font-size:17px;margin-bottom:10px}
.q{border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:12px;background:#fcfdfd}
.q .qt{font-weight:600;margin-bottom:10px}
.q .qt em{font-style:normal;color:var(--brass);margin-left:6px}
.opt{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:right;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:10px 12px;margin:6px 0;line-height:1.6}
.opt .l{flex:none;width:24px;height:24px;border-radius:50%;background:var(--line2);display:grid;place-items:center;font-size:13px;font-weight:700}
.opt.ok{border-color:var(--ok);background:var(--okTint)}
.opt.ok .l{background:var(--ok);color:#fff}
.opt.bad{border-color:var(--bad);background:var(--badTint)}
.opt.bad .l{background:var(--bad);color:#fff}
.opt:disabled{cursor:default;color:var(--ink)}
.verdict{font-weight:700;font-size:14px;margin-top:6px}
.verdict.ok{color:var(--ok)} .verdict.bad{color:var(--bad)}
.pager{display:flex;justify-content:space-between;gap:10px;margin-top:18px}
.empty{padding:40px 20px;text-align:center;color:var(--ink2)}
/* quiz */
.quizBox{max-width:760px;margin:0 auto}
.quizHead{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;color:var(--ink2);font-size:14px}
.qsrc{font-size:13px;color:var(--brass);font-weight:600;margin-bottom:4px}
.result{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:28px;text-align:center}
.result .score{font-size:54px;font-weight:700;color:var(--pri)}
.brk{text-align:right;margin-top:18px}
.brk div{display:flex;justify-content:space-between;border-top:1px solid var(--line2);padding:8px 0;font-size:15px}
.settings{max-width:620px}
.field{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:12px}
.field label{display:block;font-weight:600;margin-bottom:6px}
.field input,.field select{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--paper)}
.papersGrid{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:8px 16px;margin-bottom:24px}
.yr{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 0;border-bottom:1px solid var(--line2)}
.yr:last-child{border-bottom:0}
.yr>b{min-width:56px;color:var(--brass);font-size:17px}
.chip{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:6px 14px;font-weight:600;font-size:14px}
.chip small{color:var(--ink3);font-weight:400;margin-right:6px}
.pq .meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:8px;font-size:13px}
.tag{border-radius:999px;padding:2px 10px;font-weight:600;background:var(--brassTint);color:var(--brass)}
.tag.law{background:var(--priTint);color:var(--pri)}
.tag.changed{background:#fff1d6;color:#9a5b00}
.tag.obsolete{background:#eceff1;color:#5b6770}
.tag.unverified{background:#f3e8f7;color:#7a3f8f}
.expl{margin-top:8px;font-size:14px;color:var(--ink2);background:var(--paper);border-radius:10px;padding:10px 12px}
details.model{margin-top:10px}
details.model summary{cursor:pointer;font-weight:600;color:var(--pri)}
.qbody{white-space:pre-line}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 18px;border-radius:12px;font-size:14px;z-index:50;display:none;max-width:90vw}
.drawerBtn{display:none}
@media (max-width:860px){
  .study{grid-template-columns:1fr}
  .index{position:fixed;inset:0 auto 0 0;top:0;width:min(330px,88vw);max-height:none;height:100%;border-radius:0;z-index:40;transform:translateX(-105%);transition:transform .2s ease;padding-top:env(safe-area-inset-top)}
  .index.open{transform:none;box-shadow:0 0 0 100vmax rgba(10,20,20,.35)}
  .drawerBtn{display:inline-block}
  .papers{grid-template-columns:1fr}
  .tools{grid-template-columns:1fr}
  .article{padding:20px 18px}
  .legal{font-size:18px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

function lawStats(id){
  const m=META[id], v=Object.keys(visited(id)).length, a=answers(); let n=0,c=0;
  for(const k in a){if(k.startsWith(id+'|')){n++;c+=a[k]}}
  return {read:v,total:m.a,pct:m.a?Math.round(v/m.a*100):0,answered:n,correct:c,acc:n?Math.round(c/n*100):null};
}
function sectionPct(s){let r=0,t=0;s.laws.forEach(id=>{const x=lawStats(id);r+=x.read;t+=x.total});return t?Math.round(r/t*100):0}

/* legal text renderer */
function renderLegal(src){
  const out=[];let inLetter=false,li=-1;
  String(src).split('\n').forEach(raw=>{
    const l=raw.trim(); if(!l)return; li++;
    const A=` data-li="${li}"`;let m;
    if(l.includes(' | ')){out.push('<table><tr'+A+'>'+l.split(' | ').map(c=>'<td>'+esc(c)+'</td>').join('')+'</tr></table>');return}
    if((m=l.match(/^((?:[أ-ي]|هـ))\s*[-.)]\s*(.*)$/))&&m[2]){inLetter=true;out.push(`<div class="lv1"${A}><span class="lb">${esc(m[1])}</span><p>${esc(m[2])}</p></div>`);return}
    if((m=l.match(/^\(?([٠-٩0-9]{1,2})\s*[-.)]\s*(.*)$/))&&m[2]){out.push(`<div class="${inLetter?'lv2':'lv1'}"${A}><span class="lb">${esc(m[1])}</span><p>${esc(m[2])}</p></div>`);return}
    if((m=l.match(/^([^:]{2,40}?)\s*:\s*(.+)$/))&&!/[.،]/.test(m[1])){out.push(`<div class="def"${A}><b>${esc(m[1])}</b><p>${esc(m[2])}</p></div>`);return}
    inLetter=false; out.push('<p'+A+'>'+esc(l)+'</p>');
  });
  return out.join('').replace(/<\/table><table>/g,'');
}
/* ---------- voice: reads line by line, can pause and continue from the same place ---------- */
const Voice={
  list(){const v=('speechSynthesis' in window)?speechSynthesis.getVoices():[];
    const ar=v.filter(x=>/^ar([-_]|$)/i.test(x.lang));
    const sc=x=>(/ar[-_]JO/i.test(x.lang)||/Jordan/i.test(x.name)?100:0)+(/Natural|Online|Neural|Enhanced|Premium/i.test(x.name)?20:0)+(/ar[-_]SA/i.test(x.lang)?5:0);
    return ar.sort((a,b)=>sc(b)-sc(a));},
  pick(){const l=this.list(),n=S.get('voice','');return l.find(x=>x.name===n)||l[0]||null},
  label(x){const c=((x.lang||'').split(/[-_]/)[1]||'').toUpperCase();const m={JO:'الأردن',SA:'السعودية',EG:'مصر',AE:'الإمارات',KW:'الكويت',QA:'قطر',BH:'البحرين',OM:'عُمان',LB:'لبنان',SY:'سوريا',PS:'فلسطين',IQ:'العراق',MA:'المغرب',DZ:'الجزائر',TN:'تونس',LY:'ليبيا',YE:'اليمن'};return x.name.replace(/Microsoft |Google |\(Natural\)|Online/gi,'').trim()+(m[c]?' — '+m[c]:'')},
  st:{chunks:[],i:0,playing:false,tok:0,key:null},
  utter(text){const u=new SpeechSynthesisUtterance(text);const v=this.pick();if(v){u.voice=v;u.lang=v.lang}else u.lang='ar-JO';u.rate=S.get('rate',0.9);return u},
  // build chunks: each legal line, long lines split at sentence/clause ends
  load(key,src,title){
    const st=this.st; if(st.key===key&&st.chunks.length)return;
    this.halt(); const chunks=[];
    if(title)chunks.push({t:title,li:-1});
    String(src).split('\n').map(x=>x.trim()).filter(Boolean).forEach((l,li)=>{
      l=l.replace(/\s\|\s/g,'، ');
      const parts=l.length>220?l.split(/(?<=[.؛،:])\s+/):[l];let buf='';
      parts.forEach(p=>{if((buf+' '+p).length>220&&buf){chunks.push({t:buf,li});buf=p}else buf=buf?buf+' '+p:p});
      if(buf)chunks.push({t:buf,li});
    });
    Object.assign(st,{chunks,i:0,playing:false,key});
  },
  next(){
    const st=this.st; if(!st.playing)return;
    if(st.i>=st.chunks.length){st.playing=false;st.i=0;this.mark(-2);this.ui();return}
    const tok=st.tok,c=st.chunks[st.i];this.mark(c.li);
    const u=this.utter(c.t);
    u.onend=()=>{if(tok!==st.tok)return;st.i++;this.next()};
    u.onerror=()=>{if(tok!==st.tok)return;st.i++;this.next()};
    speechSynthesis.speak(u);
  },
  toggle(){
    if(!('speechSynthesis' in window)){toast('القراءة الصوتية غير مدعومة على هذا المتصفح');return}
    const st=this.st;
    if(st.playing){st.playing=false;st.tok++;speechSynthesis.cancel();this.ui();return}
    st.playing=true;st.tok++;speechSynthesis.cancel();this.ui();this.next();
  },
  restart(){const st=this.st;st.tok++;speechSynthesis.cancel();st.i=0;st.playing=false;this.mark(-2);this.toggle()},
  seek(li){const st=this.st;const k=st.chunks.findIndex(c=>c.li===li);if(k<0)return;st.tok++;speechSynthesis.cancel();st.i=k;st.playing=false;this.toggle()},
  halt(){const st=this.st;st.tok++;st.playing=false;if('speechSynthesis' in window)speechSynthesis.cancel()},
  stop(){this.halt();this.st.key=null;this.st.chunks=[]},
  mark(li){document.querySelectorAll('.legal .reading').forEach(e=>e.classList.remove('reading'));
    if(li>=0){const e=document.querySelector(`.legal [data-li="${li}"]`);if(e){e.classList.add('reading');const r=e.getBoundingClientRect();if(r.top<80||r.bottom>innerHeight-40)e.scrollIntoView({block:'center',behavior:'smooth'})}}},
  ui(){const b=document.getElementById('vPlay');if(!b)return;const st=this.st;
    const started=st.i>0||st.playing;
    b.innerHTML=st.playing?'⏸ إيقاف مؤقت':(started?'▶ متابعة القراءة':'🔊 استمع للمادة');
    b.classList.toggle('pri',st.playing);
    const r=document.getElementById('vRestart');if(r)r.style.display=started?'':'none';}
};

function answer(btn,j){
  const q=btn.closest('.q');if(q.dataset.done)return;q.dataset.done=1;
  const c=+q.dataset.correct,ok=j===c,opts=q.querySelectorAll('.opt');
  opts.forEach(o=>o.disabled=true);opts[c].classList.add('ok');if(!ok)opts[j].classList.add('bad');
  const old=q.querySelector('.verdict');if(old)old.remove();
  q.insertAdjacentHTML('beforeend',`<div class="verdict ${ok?'ok':'bad'}">${ok?'إجابة صحيحة':'الإجابة الصحيحة: '+LETTERS[c]}</div>`);
  if(q.dataset.key)record(q.dataset.key,ok);
  if(q.dataset.cb)window[q.dataset.cb](ok);
}
/* ---------- quiz engine (law quiz, mock, review) ---------- */
let QZ=null;
function startQuiz(items,title,back){QZ={items,i:0,score:0,title,back,log:[]};renderQuiz()}
function renderQuiz(){
  const z=QZ;
  if(z.i>=z.items.length){
    const pct=Math.round(z.score/z.items.length*100),by={};
    z.log.forEach(r=>{by[r.law]=by[r.law]||{n:0,c:0};by[r.law].n++;by[r.law].c+=r.ok?1:0});
    $('#view').innerHTML=`<div class="quizBox"><div class="result"><div class="muted">${esc(z.title)}</div><div class="score">${z.score} / ${z.items.length}</div><b>${pct>=70?'أداء ممتاز، استمر':pct>=50?'جيد، راجع المواد التي أخطأت فيها':'تحتاج مراجعة أكثر لهذه المواد'}</b>
      <div class="brk">${Object.keys(by).map(l=>`<div><span>${esc(META[l].name)}</span><b>${by[l].c} / ${by[l].n}</b></div>`).join('')}</div>
      <div class="pager"><button class="btn big" onclick="go('${z.back}')">رجوع</button><button class="btn big pri" onclick="route(true)">اختبار جديد</button></div></div></div>`;
    return;
  }
  const it=z.items[z.i],q=it.q,order=shuffle(q.o.map((_,k)=>k));
  $('#view').innerHTML=`<div class="quizBox"><div class="quizHead"><span>${esc(z.title)}</span><span>السؤال ${z.i+1} من ${z.items.length} • الصحيح ${z.score}</span></div>
   <div class="bar" style="max-width:none;margin-bottom:16px"><i style="width:${z.i/z.items.length*100}%"></i></div>
   <div class="q" data-key="${it.key}" data-correct="${order.indexOf(q.a)}" data-cb="quizCb"><div class="qsrc">${esc(META[it.law].name)} — ${esc(artLabel(it.n))}</div><div class="qt">${esc(q.q)}</div>
   ${order.map((k,j)=>`<button class="opt" onclick="answer(this,${j})"><span class="l">${LETTERS[j]}</span><span>${esc(q.o[k])}</span></button>`).join('')}</div>
   <div class="pager"><button class="btn" onclick="go('/law/${it.law}/${encodeURIComponent(it.n)}')">افتح المادة</button><button class="btn big pri" id="nextQ" disabled onclick="QZ.i++;renderQuiz()">التالي ‹</button></div></div>`;
}
function quizCb(ok){const it=QZ.items[QZ.i];if(ok)QZ.score++;QZ.log.push({law:it.law,ok});$('#nextQ').disabled=false;$('#nextQ').focus()}
function pool(d){const out=[];d.articles.forEach(a=>a.qs.forEach((q,qi)=>out.push({law:d.id,n:a.n,q,key:d.id+'|'+a.n+'|'+qi})));return out}
async function viewQuiz(id){
  const m=META[id];const s=sectionOf(id);
  setTop(`${backBtn('/law/'+id,m.name)}<div class="crumb"><small>${esc(m.name)}</small><b>اختبار سريع</b></div>`);
  const d=await loadLaw(id);const ans=answers();
  const p=pool(d),fresh=shuffle(p.filter(x=>!(x.key in ans)||ans[x.key]===0));
  const items=(fresh.length>=10?fresh:fresh.concat(shuffle(p.filter(x=>ans[x.key]===1)))).slice(0,10);
  startQuiz(items,'اختبار سريع — '+m.name,'/law/'+id);
}
async function viewMock(){
  setTop(`${backBtn('/','الرئيسية')}<div class="crumb"><b>امتحان تجريبي</b></div>`);
  $('#view').innerHTML='<div class="empty">جارٍ تجهيز الأسئلة…</div>';
  const ids=Object.keys(META);await Promise.all(ids.map(loadLaw));
  const N=50,items=[];
  SECTIONS.forEach(s=>{const k=Math.max(1,Math.round(N*s.marks/100));let p=[];s.laws.forEach(l=>p=p.concat(pool(JCPA_DATA[l])));items.push(...shuffle(p).slice(0,k))});
  startQuiz(shuffle(items).slice(0,N),'امتحان تجريبي (٥٠ سؤالاً)','/');
}
async function viewReview(){
  setTop(`${backBtn('/','الرئيسية')}<div class="crumb"><b>مراجعة أخطائي</b></div>`);
  const ans=answers(),wrong=Object.keys(ans).filter(k=>ans[k]===0);
  if(!wrong.length){$('#view').innerHTML='<div class="empty"><b>لا توجد أسئلة خاطئة محفوظة.</b><br>أي سؤال تخطئ فيه أثناء الدراسة أو الاختبار يظهر هنا لتعيد حله.</div>';return}
  const laws=[...new Set(wrong.map(k=>k.split('|')[0]))].filter(l=>META[l]);await Promise.all(laws.map(loadLaw));
  const items=[];wrong.forEach(k=>{const [l,n,qi]=k.split('|');const d=JCPA_DATA[l];if(!d)return;const a=d.articles.find(x=>x.n===n);if(a&&a.qs[+qi])items.push({law:l,n,q:a.qs[+qi],key:k})});
  startQuiz(shuffle(items).slice(0,20),'مراجعة أخطائي','/');
}
function viewSettings(){
  setTop(`${backBtn('/','الرئيسية')}<div class="crumb"><b>الإعدادات</b></div>`);
  const vs=Voice.list(),cur=Voice.pick(),rate=S.get('rate',0.9);
  $('#view').innerHTML=`<div class="settings">
   <div class="field"><label for="nm">الاسم الظاهر في الترحيب</label><input id="nm" value="${esc(S.get('name','يوسف'))}" onchange="S.set('name',this.value.trim()||'يوسف');toast('تم حفظ الاسم')"></div>
   <div class="field"><label for="vc">صوت القراءة</label><select id="vc" onchange="S.set('voice',this.value);toast('تم اختيار الصوت')">${vs.length?vs.map(v=>`<option value="${esc(v.name)}" ${cur&&v.name===cur.name?'selected':''}>${esc(Voice.label(v))}</option>`).join(''):'<option>لا يوجد صوت عربي على هذا الجهاز</option>'}</select>
     <small class="muted">يُفضَّل الصوت الأردني تلقائياً إذا كان متوفراً على الجهاز.</small></div>
   <div class="field"><label for="rt">سرعة القراءة</label><select id="rt" onchange="S.set('rate',+this.value)">${[[0.75,'بطيئة'],[0.9,'عادية'],[1.05,'سريعة']].map(([v,t])=>`<option value="${v}" ${v==rate?'selected':''}>${t}</option>`).join('')}</select>
     <div class="voice"><button class="btn" onclick="Voice.halt();speechSynthesis.speak(Voice.utter('يسمى هذا القانون قانون ضريبة الدخل'))">جرّب الصوت</button></div></div>
   <div class="field"><label>التقدم المحفوظ</label><small class="muted">التقدم محفوظ على هذا الجهاز فقط.</small><div class="voice"><button class="btn" onclick="if(confirm('حذف كل التقدم والإجابات المحفوظة؟')){Object.keys(localStorage).filter(k=>k.startsWith('jcpa2_')&&!/name|voice|rate/.test(k)).forEach(k=>localStorage.removeItem(k));toast('تم حذف التقدم')}">حذف التقدم</button></div></div>
  </div>`;
}
/* ---------- past exam questions ---------- */
function loadExams(){return loadLaw('exams')}
const ST_LABEL={changed:'تغيّرت حسب القانون الحالي',obsolete:'حكم ملغى حالياً',unverified:'غير مؤكد — قانون غير مدرج'};
function pastCard(q,showLaw){
  const key='past|'+q.pid+'|'+q.num;
  const lawName=q.law&&META[q.law]?META[q.law].name:(q.law||'').replace(/^other:/,'');
  const meta=`<div class="meta"><span class="tag">${esc(q.label)} — سؤال ${q.num}</span>${showLaw&&lawName?`<span class="tag law">${esc(lawName)}</span>`:''}${q.status&&q.status!=='valid'?`<span class="tag ${q.status}">${ST_LABEL[q.status]||q.status}</span>`:''}</div>`;
  const art=q.article&&META[q.law]?` <a href="#/law/${q.law}/${encodeURIComponent(q.article)}">افتح المادة ${esc(q.article)}</a>`:'';
  const expl=(q.explanation||'')+(q.status==='changed'&&q.orig_answer!=null?` (إجابة الامتحان وقتها: ${LETTERS[q.orig_answer]})`:'');
  if(q.type==='essay'||!q.o){
    return `<div class="q pq">${meta}<div class="qt qbody">${esc(q.q)}</div>${q.model_answer?`<details class="model"><summary>الإجابة النموذجية</summary><div class="expl qbody">${esc(q.model_answer)}${art}</div></details>`:''}</div>`;
  }
  const hasAns=Number.isInteger(q.answer);
  return `<div class="q pq" data-key="${hasAns?key:''}" data-correct="${hasAns?q.answer:-1}" data-cb="pastCb"><div class="qt qbody">${esc(q.q)}</div>${meta}
    ${q.o.map((o,j)=>`<button class="opt" onclick="${hasAns?`answer(this,${j})`:`this.closest('.q').querySelector('.expl').style.display='block'`}"><span class="l">${LETTERS[j]}</span><span>${esc(o)}</span></button>`).join('')}
    <div class="expl" style="display:none">${esc(expl)}${art}</div></div>`;
}
function pastCb(){const e=event&&event.target&&event.target.closest('.q');if(e){const x=e.querySelector('.expl');if(x)x.style.display='block'}}
async function viewPast(id){
  const m=META[id];
  setTop(`${backBtn('/law/'+id,m.name)}<div class="crumb"><small>${esc(m.name)}</small><b>أسئلة سنوات سابقة</b></div>`);
  $('#view').innerHTML='<div class="empty">جارٍ التحميل…</div>';
  const ex=await loadExams();const list=[];
  ex.papers.forEach(p=>p.questions.forEach(q=>{if(q.law===id)list.push(Object.assign({pid:p.id,label:p.label,year:p.year},q))}));
  list.sort((a,b)=>b.year-a.year||a.num-b.num);
  const c={valid:0,changed:0,obsolete:0};list.forEach(q=>c[q.status]=(c[q.status]||0)+1);
  $('#view').innerHTML=`<div class="quizBox"><div class="lawHead"><span class="seal ic">${m.icon}</span><div><h1>أسئلة سنوات سابقة</h1><p>${esc(m.name)} — ${list.length} سؤالاً من دورات الامتحان الرسمية، محلولة حسب القانون الحالي${c.changed?` • ${c.changed} تغيّرت إجابتها`:''}</p></div></div>
    ${list.map(q=>pastCard(q,false)).join('')||'<div class="empty">لا توجد أسئلة سابقة على هذا القانون.</div>'}</div>`;
}
async function viewPaper(pid){
  setTop(`${backBtn('/leg','التشريعات')}<div class="crumb"><small>أسئلة دورات سابقة</small><b>…</b></div>`);
  const ex=await loadExams();const p=ex.papers.find(x=>x.id===pid);if(!p)return go('/leg');
  setTop(`${backBtn('/leg','التشريعات')}<div class="crumb"><small>أسئلة دورات سابقة</small><b>${esc(p.label)}</b></div>`);
  const mc=p.questions.filter(q=>q.type!=='essay'&&q.o&&Number.isInteger(q.answer)).length;
  window.PAPER_SCORE={n:0,c:0,total:mc};
  $('#view').innerHTML=`<div class="quizBox"><div class="lawHead"><div><h1>${esc(p.label)}</h1><p>الورقة الأولى — التشريعات • ${p.questions.length} سؤالاً • الإجابات حسب القوانين الحالية</p></div><div class="muted" id="paperScore"></div></div>
    ${p.questions.map(q=>pastCard(Object.assign({pid:p.id,label:p.label},q),true)).join('')}</div>`;
}
const _pastCb=pastCb;
pastCb=function(ok){_pastCb();if(window.PAPER_SCORE&&location.hash.startsWith('#/paper')){PAPER_SCORE.n++;if(ok)PAPER_SCORE.c++;const e=$('#paperScore');if(e)e.textContent=`أجبت ${PAPER_SCORE.n} من ${PAPER_SCORE.total} • الصحيح ${PAPER_SCORE.c}`}};
/* ---------- router ---------- */
function route(force){
  Voice.stop();
  const h=decodeURIComponent((location.hash||'#/').slice(1)).split('/').filter(Boolean);
  window.scrollTo(0,0);
  if(!h.length)return viewHome();
  switch(h[0]){
    case 'leg':return viewLeg();
    case 'sec':return viewSection(h[1]);
    case 'law':return viewLaw(h[1],h.slice(2).join('/')||null);
    case 'quiz':return viewQuiz(h[1]);
    case 'mock':return viewMock();
    case 'review':return viewReview();
    case 'settings':return viewSettings();
    case 'past':return viewPast(h[1]);
    case 'paper':return viewPaper(h[1]);
    default:return viewHome();
  }
}
window.addEventListener('hashchange',()=>route());
route();
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)){navigator.serviceWorker.register('sw.js').catch(()=>{})}
</script>
